<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code With AI Quiz App | Aryan Raj</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Code With AI Quiz</h1>
    <div id="quiz">
      <div class="quiz-header">
        <span id="question-number">Question 1 of 5</span>
        <span id="score-counter">Score: 0</span>
      </div>
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>
    <div id="result-card" class="result-card hidden">
      <h2>Quiz Complete! 🎉</h2>
      <p id="result"></p>
      <button id="restart-btn" class="restart-btn">Try Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
